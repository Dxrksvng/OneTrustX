name: airport-timetwin
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timetwin
      POSTGRES_USER: timetwin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetwin -d timetwin"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://timetwin:${POSTGRES_PASSWORD}@db:5432/timetwin
      DEMO_MODE: ${DEMO_MODE:-true}
      DATA_MODE: ${DATA_MODE:-synthetic}
      PUBLIC_CACHE_DIR: /public-cache
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    volumes: ["../data/raw:/public-cache:ro"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  frontend:
    build: ../frontend
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres_data:
