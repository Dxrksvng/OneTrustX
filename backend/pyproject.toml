[project]
name = "onetrustx"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "networkx>=3.4,<4", "numpy>=2,<3", "httpx>=0.28,<1"]
[project.optional-dependencies]
ingestion = ["openpyxl>=3.1,<4", "pypdf>=6,<7", "pillow>=12,<13"]
ml = ["scikit-learn>=1.6,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
